name: Build A Wear APK
on:
  workflow_dispatch:
  push:
    paths:
      - 'A_Wear_Baki_Khata_Project.zip'
      - '.github/workflows/build-apk.yml'

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Download repository files
        uses: actions/checkout@v4
      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - name: Set up Android SDK
        uses: android-actions/setup-android@v3
      - name: Install Android SDK platform
        run: sdkmanager "platforms;android-35" "build-tools;35.0.0"
      - name: Unpack Android source
        run: |
          mkdir awear-src
          unzip A_Wear_Baki_Khata_Project.zip -d awear-src
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'
      - name: Build debug APK
        working-directory: awear-src
        run: gradle --no-daemon assembleDebug
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: A-Wear-debug-APK
          path: awear-src/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
